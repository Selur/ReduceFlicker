[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-reduceflicker'
dynamic = ['version']
description = 'ReduceFlicker temporal flicker reduction plugin for VapourSynth (API 4)'
readme = 'readme.md'
requires-python = '>=3.8'
license = { file = 'LICENSE.LGPLv2.1' }
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib']
